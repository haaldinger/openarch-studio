# OpenArch Studio — companion POC stack.
# Includes the OpenArch base stack and adds Studio API, UI, Docling (Tika fallback), and Ollama.
# Run from this directory:  docker compose up -d --build
name: openarch-studio

include:
  - ../../docker-compose.yml

services:
  # The base compose ships OpenSearch without a volume, so a container recreate
  # (e.g. after a Docker restart) wipes its index while Mongo persists — leaving
  # the two stores inconsistent. Give OpenSearch a durable volume to match Mongo.
  opensearch:
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  studio-api:
    build: ./api
    environment:
      STUDIO_OPENARCH_URL: http://openarch-app:8080
      STUDIO_TIKA_URL: http://tika:9998
      STUDIO_EXTRACTOR: ${STUDIO_EXTRACTOR:-docling}
      STUDIO_DOCLING_URL: ${STUDIO_DOCLING_URL:-http://docling:5001}
      STUDIO_DOCLING_TIMEOUT_SECONDS: ${STUDIO_DOCLING_TIMEOUT_SECONDS:-300}
      STUDIO_MODEL_BASE_URL: ${STUDIO_MODEL_BASE_URL:-http://ollama:11434/v1}
      STUDIO_EMBEDDING_MODEL: ${STUDIO_EMBEDDING_MODEL:-nomic-embed-text}
      STUDIO_CHAT_MODEL: ${STUDIO_CHAT_MODEL:-llama3.2:3b}
      STUDIO_EXTRACT_MODEL: ${STUDIO_EXTRACT_MODEL:-${STUDIO_GRAPH_MODEL:-llama3.2:3b}}
      STUDIO_RERANKER_URL: ${STUDIO_RERANKER_URL-http://reranker:80}
      STUDIO_RERANK_MODEL: ${STUDIO_RERANK_MODEL:-BAAI/bge-reranker-base}
      STUDIO_GRAPH_STORE_PATH: /data/graph.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - studio-data:/data
    depends_on:
      - openarch-app
      - tika
      - docling
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8800/api/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10

  studio-web:
    build: ./web
    ports:
      - "${STUDIO_PORT:-8900}:80"
    depends_on:
      - studio-api

  tika:
    image: apache/tika:2.9.2.1-full
    expose:
      - "9998"

  # Layout-aware extraction (tables, reading order, OCR) to markdown; Tika is the fallback.
  docling:
    image: quay.io/docling-project/docling-serve-cpu:v1.38.2
    environment:
      # Server-side cap on the sync convert endpoint (default 120s); keep equal to the client timeout.
      DOCLING_SERVE_MAX_SYNC_WAIT: ${STUDIO_DOCLING_TIMEOUT_SECONDS:-300}
    expose:
      - "5001"

  # Local model runtime (OpenAI-compatible). Pull models once after start:
  #   docker compose exec ollama ollama pull nomic-embed-text
  #   docker compose exec ollama ollama pull llama3.2:3b
  ollama:
    image: ollama/ollama:latest
    expose:
      - "11434"
    volumes:
      - ollama-data:/root/.ollama

  # Cross-encoder reranker (text-embeddings-inference); see .env.example for image choice.
  reranker:
    image: ${STUDIO_RERANKER_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-1.9}
    command: --model-id ${STUDIO_RERANK_MODEL:-BAAI/bge-reranker-base} --max-batch-tokens 4096
    expose:
      - "80"
    volumes:
      - reranker-models:/data

volumes:
  ollama-data:
  studio-data:
  opensearch-data:
  reranker-models:
